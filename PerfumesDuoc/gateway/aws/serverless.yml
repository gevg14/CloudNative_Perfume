service: perfumesduoc-gateway

provider:
  name: aws
  runtime: nodejs18.x
  region: us-east-1
  environment:
    AZURE_TENANT_ID: ${env:AZURE_TENANT_ID}
    AZURE_CLIENT_ID: ${env:AZURE_CLIENT_ID}

functions:
  jwtAuthorizer:
    handler: authorizer/index.handler

  productos:
    handler: proxies/productos.handler
    events:
      - http:
          path: productos/{proxy+}
          method: any
          # Ruta pública (catálogo): sin authorizer
      - http:
          path: productos
          method: get

  carrito:
    handler: proxies/carrito.handler
    events:
      - http:
          path: carrito/{proxy+}
          method: any
          authorizer:
            name: jwtAuthorizer
            resultTtlInSeconds: 0
            identitySource: method.request.header.Authorization
            type: token

  ordenes:
    handler: proxies/ordenes.handler
    events:
      - http:
          path: ordenes/{proxy+}
          method: any
          authorizer:
            name: jwtAuthorizer
            identitySource: method.request.header.Authorization
            type: token

  notificaciones:
    handler: proxies/notificaciones.handler
    events:
      - http:
          path: notificaciones/{proxy+}
          method: any
          authorizer:
            name: jwtAuthorizer
            identitySource: method.request.header.Authorization
            type: token

  cupones:
    handler: proxies/cupones.handler
    events:
      - http:
          path: cupones/{proxy+}
          method: any
          authorizer:
            name: jwtAuthorizer
            identitySource: method.request.header.Authorization
            type: token

# Nota: cada "proxies/*.handler" reenvía la petición (HTTP proxy simple) hacia
# la IP/URL pública o Load Balancer donde estén corriendo los contenedores de
# cada microservicio en AWS (ECS/EKS/EC2). Ver proxies/README.md.
