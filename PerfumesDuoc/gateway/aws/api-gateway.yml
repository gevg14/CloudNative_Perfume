      AuthorizerId: !Ref AzureJwtAuthorizer

  # Retorno desde Webpay: el navegador vuelve de Transbank y se identifica con el token de la transaccion
  RutaPagosCommit:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: POST /api/pagos/commit
      Target: !Sub integrations/${IntegracionPagosProxy}

  RutaPagosAnular:
    Type: AWS::ApiGatewayV2::Route
