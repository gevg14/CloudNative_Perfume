      ApiId: !Ref Api
      RouteKey: POST /api/pagos/anular
      Target: !Sub integrations/${IntegracionPagosProxy}

Outputs:
  ApiGatewayUrl:
    Description: URL del API Gateway. Usala como VITE_API_GATEWAY_URL en el frontend.
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com
