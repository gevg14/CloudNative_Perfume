  # Los mas vendidos son publicos
  RutaRecomendacionesPopulares:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: GET /api/recomendaciones/populares
      Target: !Sub integrations/${IntegracionRecomendacionesProxy}

  # ---- /api/pagos -> /api/pagos (puerto 8083) ----
