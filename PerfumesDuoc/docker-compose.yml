# ============================================================================
# PerfumesDuoc - Arquitectura de Microservicios (Evaluación 3)
# ----------------------------------------------------------------------------
# Levanta todo el ecosistema en tu máquina:
#   - api-gateway (Kong): único punto de entrada del frontend, con CORS
#   - Kafka (4 tópicos) + Kafka UI, RabbitMQ, PostgreSQL
#   - products, cart, orders, notifications, coupons, profile,
#     recommendations (Node) y mspago (Spring Boot + Kafka + Webpay)
#   - frontend (React + Vite)
#
# Variables: copia .env.example a .env. Sin .env se usa el login local
# simulado (JWT_MODE=local); con los datos del tenant se usa Azure AD real.
# Despliegue en la nube: ver README.md y gateway/aws.
# ============================================================================

services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: perfumesduoc-rabbitmq
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Panel de administración http://localhost:15672 (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Kafka (Evaluación 3) en modo KRaft, un solo nodo, sin Zookeeper.
  # Dentro de la red de Docker los servicios usan kafka:9092; desde tu
  # máquina (por ejemplo con una herramienta de escritorio) usa localhost:29092.
  kafka:
    image: apache/kafka:3.9.1
    container_name: perfumesduoc-kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s

  # Crea los tópicos de forma explícita y termina.
  kafka-init:
    image: apache/kafka:3.9.1
    container_name: perfumesduoc-kafka-init
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for topico in payment-attempts payment-results fraud-alerts orders-paid; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
            --create --if-not-exists --topic $$topico --partitions 3 --replication-factor 1
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list

  # Panel web para ver tópicos, mensajes y consumer groups: http://localhost:8085
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: perfumesduoc-kafka-ui
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: perfumesduoc
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka: { condition: service_healthy }

  postgres:
    image: postgres:16-alpine
    container_name: perfumesduoc-postgres
    environment:
      POSTGRES_USER: perfumesduoc
      POSTGRES_PASSWORD: perfumesduoc
      POSTGRES_DB: perfumesduoc
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./services/products-service/sql/init.sql:/docker-entrypoint-initdb.d/01-products.sql
      - ./services/orders-service/sql/init.sql:/docker-entrypoint-initdb.d/02-orders.sql
      - ./services/coupons-service/sql/init.sql:/docker-entrypoint-initdb.d/03-coupons.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perfumesduoc -d perfumesduoc"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # API Gateway local: Kong en modo declarativo (sin base de datos).
  # Rutas y CORS están en gateway/kong/kong.yml. En la nube este papel lo
  # cumple AWS API Gateway (gateway/aws/api-gateway.yml).
  api-gateway:
    image: kong:3.9
    container_name: perfumesduoc-gateway
    ports:
      - "8080:8000"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "off"
    volumes:
      - ./gateway/kong/kong.yml:/kong/kong.yml:ro
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      timeout: 5s
      retries: 10

  products-service:
    build: ./services/products-service
    container_name: perfumesduoc-products
    ports: ["4001:4001"]
    environment:
      - PORT=4001
      - DATABASE_URL=postgres://perfumesduoc:perfumesduoc@postgres:5432/perfumesduoc
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - JWT_MODE=${JWT_MODE:-local}
      - LOCAL_JWT_SECRET=${LOCAL_JWT_SECRET:-perfumesduoc_dev_secret}
      - AZURE_TENANT_ID=${AZURE_TENANT_ID:-}
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID:-}
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  cart-service:
    build: ./services/cart-service
    container_name: perfumesduoc-cart
    ports: ["4002:4002"]
    environment:
      - PORT=4002
      - PRODUCTS_URL=http://products-service:4001
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - JWT_MODE=${JWT_MODE:-local}
      - LOCAL_JWT_SECRET=${LOCAL_JWT_SECRET:-perfumesduoc_dev_secret}
      - AZURE_TENANT_ID=${AZURE_TENANT_ID:-}
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID:-}
    depends_on:
      products-service: { condition: service_started }
      rabbitmq: { condition: service_healthy }

  orders-service:
    build: ./services/orders-service
    container_name: perfumesduoc-orders
    ports: ["4003:4003"]
    environment:
      - PORT=4003
      - DATABASE_URL=postgres://perfumesduoc:perfumesduoc@postgres:5432/perfumesduoc
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - KAFKA_BROKERS=kafka:9092
      - PRODUCTS_URL=http://products-service:4001
      - COUPONS_URL=http://coupons-service:4005
      - JWT_MODE=${JWT_MODE:-local}
      - LOCAL_JWT_SECRET=${LOCAL_JWT_SECRET:-perfumesduoc_dev_secret}
      - AZURE_TENANT_ID=${AZURE_TENANT_ID:-}
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID:-}
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      # Sin dependencia de coupons-service: los cupones son opcionales y
      # la compra debe funcionar aunque ese microservicio esté apagado.

  notifications-service:
    build: ./services/notifications-service
    container_name: perfumesduoc-notifications
    ports: ["4004:4004"]
    environment:
      - PORT=4004
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - KAFKA_BROKERS=kafka:9092
      - ALERTAS_EMAIL=${ALERTAS_EMAIL:-seguridad@perfumesduoc.cl}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-notificaciones@perfumesduoc.cl}
      - EMAIL_SIMULATION=${EMAIL_SIMULATION:-true}
    depends_on:
      rabbitmq: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }

  coupons-service:
    build: ./services/coupons-service
    container_name: perfumesduoc-coupons
    ports: ["4005:4005"]
    environment:
      - PORT=4005
      - DATABASE_URL=postgres://perfumesduoc:perfumesduoc@postgres:5432/perfumesduoc
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - JWT_MODE=${JWT_MODE:-local}
      - LOCAL_JWT_SECRET=${LOCAL_JWT_SECRET:-perfumesduoc_dev_secret}
      - AZURE_TENANT_ID=${AZURE_TENANT_ID:-}
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID:-}
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  profile-service:
    build: ./services/profile-service
    container_name: perfumesduoc-profile
    ports: ["4006:4006"]
    environment:
      - PORT=4006
      - DATABASE_URL=postgres://perfumesduoc:perfumesduoc@postgres:5432/perfumesduoc
      - JWT_MODE=${JWT_MODE:-local}
      - LOCAL_JWT_SECRET=${LOCAL_JWT_SECRET:-perfumesduoc_dev_secret}
      - AZURE_TENANT_ID=${AZURE_TENANT_ID:-}
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID:-}
    depends_on:
      postgres: { condition: service_healthy }

  recommendations-service:
    build: ./services/recommendations-service
    container_name: perfumesduoc-recommendations
    ports: ["4007:4007"]
    environment:
      - PORT=4007
      - DATABASE_URL=postgres://perfumesduoc:perfumesduoc@postgres:5432/perfumesduoc
      - KAFKA_BROKERS=kafka:9092
      - PRODUCTS_URL=http://products-service:4001
      - JWT_MODE=${JWT_MODE:-local}
      - LOCAL_JWT_SECRET=${LOCAL_JWT_SECRET:-perfumesduoc_dev_secret}
      - AZURE_TENANT_ID=${AZURE_TENANT_ID:-}
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID:-}
    depends_on:
      postgres: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }

  # Microservicio de Pagos: Spring Boot + Kafka + Webpay Plus (integración).
  # Detección temprana de fraude: FRAUDE_MAX_INTENTOS intentos dentro de
  # FRAUDE_VENTANA_SEGUNDOS bloquean al cliente FRAUDE_BLOQUEO_MINUTOS.
  mspago:
    build: ./services/mspago
    container_name: perfumesduoc-mspago
    ports: ["8083:8080"]
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/perfumesduoc
      - SPRING_DATASOURCE_USERNAME=perfumesduoc
      - SPRING_DATASOURCE_PASSWORD=perfumesduoc
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - ORDERS_URL=http://orders-service:4003
      - WEBPAY_RETURN_URL=${WEBPAY_RETURN_URL:-http://localhost:5173/callback}
      - FRAUDE_MAX_INTENTOS=${FRAUDE_MAX_INTENTOS:-3}
      - FRAUDE_VENTANA_SEGUNDOS=${FRAUDE_VENTANA_SEGUNDOS:-10}
      - FRAUDE_BLOQUEO_MINUTOS=${FRAUDE_BLOQUEO_MINUTOS:-30}
      - JWT_MODE=${JWT_MODE:-local}
      - LOCAL_JWT_SECRET=${LOCAL_JWT_SECRET:-perfumesduoc_dev_secret}
      - AZURE_TENANT_ID=${AZURE_TENANT_ID:-}
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID:-}
    depends_on:
      postgres: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }

  # Las variables VITE_* se fijan al COMPILAR el frontend (por eso van como
  # "args"). Si cambias el .env, reconstruye: docker compose up -d --build frontend
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_GATEWAY_URL: ${VITE_API_GATEWAY_URL:-http://localhost:8080}
        VITE_AUTH_MODE: ${JWT_MODE:-local}
        VITE_AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
        VITE_AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
        VITE_AZURE_REDIRECT_URI: ${VITE_AZURE_REDIRECT_URI:-http://localhost:5173}
    container_name: perfumesduoc-frontend
    ports: ["5173:80"]
    depends_on: [api-gateway]

volumes:
  pg_data:
